# Quant Cloud: run on X86_64 to match images built on standard GitHub runners.
x-quant-labels:
  quant.architecture: X86_64

services:
  app:
    image: ghcr.io/quantcdn-templates/app-sveltekit:latest
    build:
      context: .
      args:
        NODE_VERSION: "22"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
